// Medirian adapter for Minecraft 26.3 (Fabric).
// Pure Fabric Loader + Mixin: no Fabric API dependency, so the launcher ships a single jar.
// Minecraft 26.x ships without obfuscation: Loom does not remap (plugin "fabric-loom", no mappings).

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def medirianVersion = rootProject.file('../../../VERSION').text.trim()
version = "${medirianVersion}+mc${project.minecraft_version}"
group = 'dev.medirian'

base {
    archivesName = 'medirian-26.3'
}

configurations {
    // classes bundled into the mod jar
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    shade "dev.medirian:medirian-shared:${medirianVersion}"
}

loom {
    runs {
        client {
            // Development runs keep their Medirian data inside run/ instead of the real MEDIRIAN_HOME.
            // The self-test starts from a fresh one every time, so its screenshots are reproducible.
            def home = file(project.hasProperty('selftest') ? 'run/selftest-home' : 'run/medirian-home')
            if (project.hasProperty('selftest')) {
                project.delete(home)
            }
            vmArg "-Dmedirian.home=${home.absolutePath}"
            if (project.hasProperty('selftest')) {
                // ./gradlew runClient -Pselftest : screenshot walkthrough + mixin audit (see SelfTest.java)
                vmArg '-Dmedirian.selftest=true'
                vmArg '-Dmedirian.mixinAudit=true'
                programArgs '--width', '1600', '--height', '900'
            }
        }
    }
}

processResources {
    def props = [version: project.version, minecraft: project.minecraft_version, loader: project.loader_version]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // the shaded jar is produced by the included Shared build: depend on it explicitly
    dependsOn configurations.shade
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/MANIFEST.MF'
}
