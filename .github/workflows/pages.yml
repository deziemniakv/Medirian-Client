name: Website

# Publishes the Medirian Client website (website/) on GitHub Pages. scripts/build-website.mjs fills in this
# repository (the download buttons use its GitHub Releases), the Medirian Services address (status line) and
# the optional Discord / privacy / terms links from the repository's Variables, and checks the site before
# anything is published. It also runs on every published release, so the page picks up the new version.
# One-time setup: Settings → Pages → Source: GitHub Actions (docs/OWNER_SETUP.md, "Website").
on:
  push:
    branches: [main, master]
    paths: ['website/**', 'scripts/build-website.mjs', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build and check the website
        env:
          MEDIRIAN_SITE_URL: ${{ vars.MEDIRIAN_SITE_URL || steps.pages.outputs.base_url }}
          MEDIRIAN_SERVICES_URL: ${{ vars.MEDIRIAN_SERVICES_URL }}
          MEDIRIAN_DISCORD_URL: ${{ vars.MEDIRIAN_DISCORD_URL }}
          MEDIRIAN_PRIVACY_URL: ${{ vars.MEDIRIAN_PRIVACY_URL }}
          MEDIRIAN_TERMS_URL: ${{ vars.MEDIRIAN_TERMS_URL }}
        run: node scripts/build-website.mjs --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
