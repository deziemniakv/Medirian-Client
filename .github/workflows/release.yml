name: Release

# Push a tag "v<VERSION>" (e.g. v0.1.4) to publish a release on GitHub:
#   - client jars + release-manifest.json with absolute download URLs (the launcher's stable channel)
#   - launcher installers for Windows, macOS and Linux + latest*.yml (the launcher's self-update feed)
# See docs/RELEASING.md for the secrets and variables it uses.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  clients:
    name: Client jars and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build clients
        run: node scripts/build-clients.mjs --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
      - uses: actions/upload-artifact@v4
        with:
          name: release-clients
          path: distribution/

  launcher:
    name: Launcher ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # the stable channel: the manifest of the newest release
          MAIN_VITE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/release-manifest.json
          # owner-provided ids (repository variables); empty until registered
          MAIN_VITE_MSA_CLIENT_ID: ${{ vars.MSA_CLIENT_ID }}
          MAIN_VITE_DISCORD_APP_ID: ${{ vars.DISCORD_APP_ID }}
          MAIN_VITE_SERVICES_URL: ${{ vars.SERVICES_URL }}
      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # without a certificate the build is unsigned (Windows SmartScreen / macOS Gatekeeper will warn)
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npx electron-builder --${{ matrix.platform }} --publish never \
            -c.publish.provider=github \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-launcher-${{ matrix.platform }}
          path: |
            launcher/dist/*.exe
            launcher/dist/*.dmg
            launcher/dist/*.zip
            launcher/dist/*.AppImage
            launcher/dist/*.blockmap
            launcher/dist/latest*.yml

  publish:
    name: GitHub release
    needs: [clients, launcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Release notes
        run: node scripts/release-notes.mjs > release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Medirian $(cat VERSION)" \
            --notes-file release-notes.md
