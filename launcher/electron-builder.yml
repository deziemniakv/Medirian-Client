appId: dev.medirian.launcher
productName: Medirian Client
# the installed program is "Medirian Client.exe"
executableName: Medirian Client
copyright: Copyright © 2026 Medirian Client
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../CHANGELOG.md
    to: CHANGELOG.md
# No publish target here: local `npm run dist` builds do not update themselves. The release
# workflow (.github/workflows/release.yml) adds one (-c.publish.*), which makes electron-builder
# write app-update.yml and the latest*.yml feeds that the launcher's updater reads.
#
# Code signing comes from the environment (npm run dist also reads ../.env), never from this file:
# WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (Windows Authenticode), CSC_LINK / CSC_KEY_PASSWORD (macOS Developer ID),
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for notarization; Azure Artifact Signing is added by
# the release workflow (win.azureSignOptions). See docs/OWNER_SETUP.md, "Code signing".
win:
  target: nsis
  icon: resources/icon.png
# MedirianClientSetup.exe: a classic wizard that installs for the current user without
# administrator rights (%LOCALAPPDATA%/Programs/Medirian Client; "all users" is offered and
# elevates), with desktop and Start Menu shortcuts and an "Apps & features" entry. The name has no
# version so https://github.com/<owner>/<repo>/releases/latest/download/MedirianClientSetup.exe
# always points at the newest installer; the self-update feed (latest.yml) names it too.
# Updates install over the same folder; player data lives in MEDIRIAN_HOME (%APPDATA%/.medirian)
# and is never touched by installing, updating or uninstalling.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Medirian Client
  uninstallDisplayName: Medirian Client
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerSidebar: resources/installerSidebar.bmp
  uninstallerSidebar: resources/uninstallerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
  installerLanguages: [en_US, pl_PL, de_DE, es_ES]
  artifactName: MedirianClientSetup.${ext}
mac:
  # the zip is what electron-updater installs on macOS; the dmg is for first installs
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.games
  artifactName: MedirianClient-${version}-${arch}.${ext}
linux:
  target: AppImage
  icon: resources/icon.png
  category: Game
  artifactName: MedirianClient-${version}-${arch}.${ext}
